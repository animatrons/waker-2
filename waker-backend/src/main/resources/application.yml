spring:
  application:
    name: waker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

# Explicit origin list only — never "*" (AD-9). Override per profile as needed.
waker:
  cors:
    allowed-origins:
      - http://localhost:3000
  jwt:
    secret: ${WAKER_JWT_SECRET}
    expiration: ${WAKER_JWT_EXPIRATION:1h}
  rate-limit:
    capacity: ${WAKER_RATE_LIMIT_CAPACITY:10}
    window: ${WAKER_RATE_LIMIT_WINDOW:15m}
  commitment:
    edit-window-cooldown: ${WAKER_COMMITMENT_EDIT_WINDOW_COOLDOWN:10m}
    max-pending: ${WAKER_COMMITMENT_MAX_PENDING:5}
    max-page-size: ${WAKER_COMMITMENT_MAX_PAGE_SIZE:100}
  mail:
    from: ${WAKER_MAIL_FROM:waker@localhost}
  penalty:
    max-page-size: ${WAKER_PENALTY_MAX_PAGE_SIZE:100}
  sweep:
    interval: ${WAKER_SWEEP_INTERVAL:60s}
    dispatch-batch-size: ${WAKER_SWEEP_DISPATCH_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    # Penalty SMTP is async outbox delivery — not a readiness dependency (Story 3.6 owns sweep health).
    mail:
      enabled: false

logging:
  structured:
    format:
      console: ecs
