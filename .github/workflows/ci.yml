# CI for waker-backend (Story 1.2).
# Required GitHub branch protection (Settings → Branches → main):
#   - Require status checks to pass before merging
#   - Required checks: "build-test" and "secret-scan"
# Without branch protection enabled, failing jobs still fail the workflow but do not
# automatically block merges.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Spotless check is bound to verify in waker-backend/pom.xml.
      # Docker is available on ubuntu-latest for Testcontainers (singleton Postgres).
      - name: Build, Spotless check, and test
        run: mvn -B -f waker-backend verify

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan rewritten paths only. Legacy waker-back/ (hardcoded Mongo + JWT secrets)
      # and waker-front/ are intentionally excluded until deleted — a full-repo scan
      # would fail forever and is not a substitute for cleaning new code (AC #4).
      # Using the gitleaks CLI image avoids GITLEAKS_LICENSE (required by gitleaks-action
      # for some GitHub Organization accounts).
      - name: Run gitleaks on new codebase paths
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --verbose \
            --redact \
            --exit-code=1
